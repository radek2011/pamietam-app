<body>

<script>
/* Pamiętam 1.0 – lokalny organizer relacji. Bez serwera i zewnętrznych bibliotek. */
(() => {
  'use strict';
  const STORE = 'pamietam_v1';
  const LEGACY_STORE = 'bliscy_v1'; // zgodność ze starszą wersją, gdy działała na tej samej domenie
  const RELATIONS = ['Rodzina','Przyjaciel','Znajomy','Inna relacja'];
  const DAYS = [3,7,14,30,60,90];
  const main = document.getElementById('app-main');
  const overlay = document.getElementById('overlay');
  const dialog = document.getElementById('dialog');
  const toastBox = document.getElementById('toast');
  const vcfInput = document.getElementById('vcf-input');
  const backupInput = document.getElementById('backup-input');
  let currentView = 'today';
  let searchText = '';
  let currentFilter = 'all';
  let toastTimer;
  let lastModalFocus = null;
  let undoAction = null;
  let importCandidates = [];
  let pendingInstall = null;

  function id() { return (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'b-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2); }
  function localDate(date = new Date()) { const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; }
  function parseDate(s) { if(!/^\d{4}-\d\d-\d\d$/.test(s||'')) return null; const [y,m,d]=s.split('-').map(Number); const date=new Date(y,m-1,d,12); return date.getFullYear()===y&&date.getMonth()===m-1&&date.getDate()===d ? date:null; }
  function addDays(s,n) { const d=parseDate(s)||new Date();d.setDate(d.getDate()+n);return localDate(d); }
  function dayDiff(dateStr) { const a=parseDate(localDate()), b=parseDate(dateStr);return b?Math.round((b-a)/86400000):0; }
  function formatDate(s, opts={day:'numeric',month:'long'}) {const d=parseDate(s);return d?new Intl.DateTimeFormat('pl-PL',opts).format(d):'—';}
  function escapeHTML(s) { return String(s??'').replace(/[&<>"']/g, x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])); }
  function clampStr(v,max=250) { return String(v||'').trim().slice(0,max); }
  function safePhone(s) {return clampStr(s,40).replace(/[^0-9+()\-\s]/g,'');}
  function normalizedPhone(s) {let v=String(s||'').replace(/\D/g,'');if(v.length===9)v='48'+v;return v;}
  function initials(s) {return String(s||'?').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toLocaleUpperCase('pl-PL')||'?';}
  function freshState() {return {version:1,people:[],history:[]};}
  function sanitizePerson(input) {
    const obj=input&&typeof input==='object'?input:{};
    const name=clampStr(obj.name,110);
    if(!name) return null;
    const freq=Number(obj.frequency);
    return {id:clampStr(obj.id,85)||id(),name,relation:RELATIONS.includes(obj.relation)?obj.relation:'Inna relacja',phone:safePhone(obj.phone),frequency:Number.isInteger(freq)&&freq>=1&&freq<=365?freq:14,lastContact:parseDate(obj.lastContact)?obj.lastContact:'',birthday:parseDate(obj.birthday)?obj.birthday:'',note:clampStr(obj.note,600),createdAt:parseDate(obj.createdAt)?obj.createdAt:localDate()};
  }

  }
  async function copyMessage(pId,i){const p=db.people.find(x=>x.id===pId);if(!p)return;const msgs=[`Cześć ${p.name.split(' ')[0]}! Co u Ciebie słychać? Dawno nie rozmawialiśmy.`,`Hej! Przyszło mi dziś do głowy, żeby się odezwać. Jak Ci mija tydzień?`,`Cześć! Masz w najbliższych dniach chwilę na rozmowę?`];const msg=msgs[i];if(!msg)return;try{await navigator.clipboard.writeText(msg);toast('Skopiowano wiadomość.');}catch{toast('Nie udało się skopiować wiadomości.');}}
  function markContact(pId){const p=db.people.find(x=>x.id===pId);if(!p)return;const previous=p.lastContact, today=localDate();const ev={id:id(),personId:pId,date:today};p.lastContact=today;db.history.push(ev);persist();closeDialog();render();toast(`Zapisano kontakt: ${p.name}.`,()=>{p.lastContact=previous;db.history=db.history.filter(h=>h.id!==ev.id);persist();render();});}
  function deletePerson(pId){const p=db.people.find(x=>x.id===pId);if(!p)return;if(!confirm(`Usunąć osobę „${p.name}” i historię jej rozmów?`))return;db.people=db.people.filter(x=>x.id!==pId);db.history=db.history.filter(x=>x.personId!==pId);persist();closeDialog();render();toast('Usunięto osobę.');}
  function exportBackup(){const data={app:'Pamiętam',exportedAt:new Date().toISOString(),...db};downloadBlob(JSON.stringify(data,null,2),`pamietam-kopia-${localDate()}.json`,'application/json;charset=utf-8');toast('Kopia zapasowa została pobrana.');}
  function downloadBlob(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
  function importBackupFile(file){if(!file)return;if(file.size>8*1024*1024){toast('Plik kopii jest zbyt duży.');return;}const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(String(reader.result));if(!['Pamiętam','Bliscy'].includes(raw.app)||raw.version!==1)throw Error('Nieprawidłowa kopia aplikacji Pamiętam / Bliscy 1.0.');const next=sanitizedState(raw);if(!confirm(`Ta operacja ZASTĄPI aktualne dane (${db.people.length} osób) danymi z kopii (${next.people.length} osób). Kontynuować?`))return;db=next;persist();setView('today');toast('Przywrócono kopię zapasową.');}catch(e){toast('Błąd kopii: '+String(e.message).slice(0,90));}};reader.onerror=()=>toast('Nie udało się odczytać pliku.');reader.readAsText(file,'utf-8');}
  function getVCards(text){
    const unfolded=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n[ \t]/g,'');
    const blocks=[...unfolded.matchAll(/BEGIN:VCARD\s*\n([\s\S]*?)END:VCARD/gi)].slice(0,1500);
    const decode=(value)=>value.replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1').trim();
    const records=[];
    for(const block of blocks){const lines=block[1].split('\n');let name='',given='',family='',phone='';
      for(const line of lines){const idx=line.indexOf(':');if(idx<0)continue;const property=line.slice(0,idx).split(';')[0].toUpperCase().split('.').pop();let val=line.slice(idx+1).trim();
        if(property==='FN'&&!name)name=decode(val);
        else if(property==='N'&&(!given||!family)){const parts=val.split(';');family=decode(parts[0]||'');given=decode(parts[1]||'');}
        else if(property==='TEL'&&!phone)phone=safePhone(decode(val.replace(/^tel:/i,'')));
      }
      name=name||[given,family].filter(Boolean).join(' ');
      if(name)records.push({name:clampStr(name,110),phone});
    }
    const seen=new Set();return records.filter(r=>{const key=r.name.toLowerCase()+'|'+normalizedPhone(r.phone);if(seen.has(key))return false;seen.add(key);return true;});
  }
  function vcfFile(file){if(!file)return;if(file.size>4*1024*1024){toast('Plik VCF przekracza limit 4 MB.');return;}const reader=new FileReader();reader.onload=()=>{const cards=getVCards(String(reader.result||''));if(!cards.length){toast('Nie znaleziono kontaktów w pliku VCF.');return;}importCandidates=cards;showImportModal();};reader.onerror=()=>toast('Nie udało się odczytać pliku VCF.');reader.readAsText(file,'utf-8');}
  function showImportModal(){const count=importCandidates.length;openDialog(`${dialogHeader('Wybierz kontakty','Import VCF — zaznacz tylko osoby, które chcesz dodać.')}<p class="import-summary">Znaleziono <strong>${count}</strong> ${count===1?'kontakt':'kontaktów'}. Domyślnie nic nie jest wybrane. Możesz też ustalić wspólną częstotliwość przypomnień.</p><div class="field-grid"><div class="field"><label for="import-relation">Relacja</label><select id="import-relation">${RELATIONS.map(r=>`<option value="${r}">${r}</option>`).join('')}</select></div><div class="field"><label for="import-freq">Częstotliwość</label><select id="import-freq">${DAYS.map(d=>`<option value="${d}" ${d===14?'selected':''}>Co ${d} dni</option>`).join('')}</select></div></div><div class="settings-buttons"><button class="btn btn-secondary btn-small" data-action="import-select-all">Zaznacz wszystkie</button><button class="btn btn-secondary btn-small" data-action="import-select-none">Odznacz wszystkie</button></div><div class="import-list">${importCandidates.map((p,i)=>`<label class="mini-row" style="cursor:pointer"><span><strong>${escapeHTML(p.name)}</strong><small>${escapeHTML(p.phone||'Bez numeru')}</small></span><input class="checkbox import-check" type="checkbox" value="${i}" /></label>`).join('')}</div><div class="dialog-actions"><span id="selected-count" class="hint">Zaznaczono: 0</span><div class="right"><button class="btn btn-secondary" data-action="close">Anuluj</button><button class="btn btn-primary" data-action="confirm-import">Dodaj wybrane</button></div></div>`);}
  function confirmVcfImport(){const boxes=[...dialog.querySelectorAll('.import-check:checked')];if(!boxes.length){toast('Najpierw wybierz przynajmniej jedną osobę.');return;}
    const freq=Number(dialog.querySelector('#import-freq').value),relation=dialog.querySelector('#import-relation').value;
    const existing=new Set(db.people.map(p=>p.name.toLocaleLowerCase('pl')+'|'+normalizedPhone(p.phone)));
    let added=0, skipped=0;
    for(const box of boxes){const candidate=importCandidates[Number(box.value)];if(!candidate)continue;const key=candidate.name.toLocaleLowerCase('pl')+'|'+normalizedPhone(candidate.phone);if(existing.has(key)){skipped++;continue;}const p=sanitizePerson({...candidate,frequency:freq,relation,createdAt:localDate()});if(p){db.people.push(p);existing.add(key);added++;}}
    importCandidates=[];persist();closeDialog();currentView='people';render();toast(`Zaimportowano ${added} osób.${skipped?' Pominięto duplikaty: '+skipped+'.':''}`);
  }
  async function pickContact(){
    if(!navigator.contacts?.select){toast('Wybór z książki telefonicznej jest niedostępny. Użyj importu VCF lub dodaj osobę ręcznie.');return;}
    try{
      // select() uruchamiamy bezpośrednio po kliknięciu: nie wolno utracić aktywacji użytkownika.
      const result=await navigator.contacts.select(['name','tel'],{multiple:false});if(!result?.length)return;const contact=result[0];const name=Array.isArray(contact.name)?contact.name[0]:contact.name;const phone=Array.isArray(contact.tel)?contact.tel[0]:contact.tel;
      openForm(null,{name:clampStr(name,110),phone:safePhone(phone),relation:'Rodzina',frequency:14});
    }catch(e){if(e?.name!=='AbortError')toast('Nie udało się otworzyć kontaktów. Spróbuj importu VCF.');}
  }
  function removeAll(){if(!db.people.length){toast('Nie ma zapisanych danych.');return;}if(!confirm(`Na pewno usunąć wszystkie ${db.people.length} osób i historię rozmów? Najpierw pobierz kopię zapasową.`))return;if(!confirm('Ostatnie potwierdzenie: wszystkie dane zostaną bezpowrotnie usunięte.'))return;db=freshState();persist();setView('today');toast('Wszystkie dane usunięte.');}
  async function installApp(){if(!pendingInstall){toast('Użyj opcji „Dodaj do ekranu głównego” w przeglądarce.');return;}const prompt=pendingInstall;pendingInstall=null;await prompt.prompt();render();}
  document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-nav]');if(nav){setView(nav.dataset.nav);return;}
    const a=e.target.closest('[data-action]');if(!a)return;
    const v=a.dataset.action,id=a.dataset.id;
    switch(v){case 'add':openForm();break;case 'close':closeDialog();break;case 'details':showDetails(id);break;case 'edit':{const p=db.people.find(p=>p.id===id);if(p)openForm(p);break;}case 'done':markContact(id);break;case 'delete':deletePerson(id);break;case 'message':messageModal(id);break;case 'copy-message':copyMessage(id,Number(a.dataset.msg));break;case 'pick-contact':pickContact();break;case 'import-vcf':vcfInput.click();break;case 'export':exportBackup();break;case 'import-backup':backupInput.click();break;case 'clear-all':removeAll();break;case 'install':installApp();break;case 'import-select-all':dialog.querySelectorAll('.import-check').forEach(b=>b.checked=true);updateSelection();break;case 'import-select-none':dialog.querySelectorAll('.import-check').forEach(b=>b.checked=false);updateSelection();break;case 'confirm-import':confirmVcfImport();break;}
  });
  function updateSelection(){const el=document.getElementById('selected-count');if(el)el.textContent=`Zaznaczono: ${dialog.querySelectorAll('.import-check:checked').length}`;}
  document.addEventListener('change',e=>{if(e.target.id==='frequency'){document.getElementById('custom-period')?.classList.toggle('hidden',e.target.value!=='custom');}if(e.target.matches('.import-check'))updateSelection();if(e.target.id==='people-filter'){currentFilter=e.target.value;const cursorPos=document.activeElement?.id;render();if(cursorPos==='people-filter')document.getElementById('people-filter')?.focus();}});
  document.addEventListener('input',e=>{if(e.target.id==='people-search'){searchText=e.target.value;const list=document.getElementById('people-results');if(!list)return;const result=sortedPeople().filter(p=>(currentFilter==='all'||p.relation===currentFilter)&&[p.name,p.relation,p.phone,p.note].join(' ').toLocaleLowerCase('pl').includes(searchText.toLocaleLowerCase('pl')));list.innerHTML=result.length?result.map(p=>personCard(p)).join(''):emptyBlock('Nie znaleziono osoby','Spróbuj innego imienia lub zmień filtr.',null);const header=main.querySelector('.section-title span');if(header)header.textContent=`(${result.length})`;}});
  document.addEventListener('submit',e=>{if(e.target.id==='person-form'){e.preventDefault();savePersonFromForm(e.target);}});
  document.getElementById('top-add').addEventListener('click',()=>openForm());
  document.getElementById('bottom-add').addEventListener('click',()=>openForm());
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.classList.contains('hidden'))closeDialog();if(e.key==='Tab'&&!overlay.classList.contains('hidden')){const buttons=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(x=>x.getClientRects().length);if(!buttons.length)return;const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});
  vcfInput.addEventListener('change',()=>{const file=vcfInput.files?.[0];vcfInput.value='';vcfFile(file);});
  backupInput.addEventListener('change',()=>{const file=backupInput.files?.[0];backupInput.value='';importBackupFile(file);});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pendingInstall=e;if(currentView==='settings')render();});
  window.addEventListener('storage',e=>{if(e.key===STORE){db=load();render();}});
  if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('PWA:',e)));
  render();
})();

</script>
